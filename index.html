<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overlay Stream</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="effects.css">
</head>
<body>
  <div class="overlay">
    <div id="meren" class="frame_container">
      <div id="meren-sprite" class="sprite-layer">
          <img id="meren-bg" src="assets/screen_border_bg.png" class="layer bg">
          <img src="assets/meren_body.png" class="layer meren-full">
          <img id="meren-head" src="assets/meren_head_0.png" class="layer meren-full">
          <img src="assets/meren_hair.png" class="layer meren-full">
          <img id="meren-eye" src="assets/meren_eye_0.png" class="layer meren-full">
          <img id="meren-frame" src="assets/screen_border_off.png" class="layer frame-overlay">
      </div>
    </div>
    
    <div id="gardok" class="frame_container">
      <div id="gardok-sprite" class="sprite-layer">
        <img id="meren-bg" src="assets/screen_border_bg.png" class="layer bg">
        <img src="assets/gardok_body.png" class="layer gardok-full">
        <img id="gardok-head" src="assets/gardok_head_0.png" class="layer gardok-full">
        <img src="assets/gardok_hair.png" class="layer gardok-full">
        <img src="assets/gardok_goggles.png" class="layer gardok-full">
        <img id="gardok-left-eye" src="assets/gardok_left_eye_0.png" class="layer gardok-full">
        <img id="gardok-right-eye" src="assets/gardok_right_eye_0.png" class="layer gardok-full">
        <img id="gardok-frame" src="assets/screen_border_off.png" class="layer frame-overlay">
      </div>
    </div>    

  </div>

  <main id="sender-panel" hidden style="font-family: sans-serif; padding: 24px; max-width: 520px; color: rgb(119, 82, 135); background: #111; min-height: 100vh; box-sizing: border-box;">
    <h1>Micro <span id="sender-name"></span></h1>
    <p>WebSocket : <strong id="sender-connection-status">Connexion…</strong></p>
    <p>Microphone : <strong id="sender-microphone-status">Initialisation…</strong></p>
    <button id="start-microphone" type="button" style="padding: 10px 16px; margin: 8px 0 18px; cursor: pointer;">
      Activer le micro
    </button>
    <div style="height: 18px; background: #492c64; border-radius: 9px; overflow: hidden;">
      <div id="sender-meter-fill" style="height: 100%; width: 0%; background: #fff; transition: width 50ms linear;"></div>
    </div>
    <p>Garde cette page ouverte pendant le stream.</p>
  </main>

  <script src="gardokAnimator.js" defer></script>
  <script src="merenAnimator.js" defer></script>
  <script src="effects.js" defer></script>
  <script src="scripts.js" defer></script>
  <script src="overlay-client.js" defer></script>
</body>
</html>
