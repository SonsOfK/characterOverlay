<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overlay Stream</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="overlay">
    <!-- Portrait et cadre pour Meren -->
    <div id="meren" class="frame-container">
      <img id="meren-frame" class="frame inactive" src="assets/frame_on.png" alt="Frame Meren">
      <img id="meren-portrait" class="portrait inactive" src="assets/portrait_meren_on.png" alt="Portrait Meren">
    </div>

    <!-- Portrait et cadre pour Gardok -->
    <div id="gardok" class="frame_container">
      <img id="gardok-frame" class="frame inactive" src="assets/frame_on.png" alt="Frame Gardok">
      <img id="gardok-portrait" class="portrait inactive" src="assets/portrait_gardok_on.png" alt="Portrait Gardok">
    </div>

  </div>
  <script src="https://cdn.jsdelivr.net/npm/obs-websocket-js"></script>
  <script src="scripts.js" defer></script>
</body>
</html>
